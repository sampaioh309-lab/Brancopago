<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Hunter Branco Manual PRO</title>

<style>
body { background:#020617; color:#fff; font-family:Arial; text-align:center; }
.container { max-width:900px; margin:auto; display:none; }

.btn {
    font-size:30px; padding:15px; margin:5px;
    border:none; border-radius:10px; cursor:pointer;
}

.vermelho { background:#ef4444; }
.preto { background:#111; color:#fff; }
.branco { background:#fff; color:#000; }

.numero-btn { padding:10px; margin:5px; border-radius:8px; border:none; cursor:pointer; }

.card { background:#0f172a; margin:10px; padding:15px; border-radius:10px; }

.sinal { background:#1e293b; margin:5px; padding:10px; border-radius:8px; }

.relogio { font-size:20px; font-weight:bold; color:#38bdf8; margin-top:10px; }

#historico {
    display:flex;
    justify-content:flex-end;
    flex-wrap:nowrap;
    overflow:hidden;
}

.bolinha {
    width:32px; height:32px; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center;
    font-weight:bold; margin:3px; font-size:14px;
}

.b-vermelho { background:#ef4444; color:#fff; }
.b-preto { background:#111; color:#fff; }
.b-branco { background:#fff; color:#000; box-shadow:0 0 6px #fff; }

.modal {
    position:fixed; top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.8);
    display:none; justify-content:center; align-items:center;
}

.modal-content { background:#0f172a; padding:20px; border-radius:10px; }

/* LOGIN */
#loginTela{
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:#020617;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:#0f172a;
    padding:30px;
    border-radius:10px;
}

input{
    padding:10px;
    margin:10px;
    border:none;
    border-radius:5px;
    width:200px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginTela">
    <div class="login-box">
        <h2>🔒 Acesso restrito</h2>
        <input type="text" id="user" placeholder="Usuário"><br>
        <input type="password" id="pass" placeholder="Senha"><br>
        <button onclick="logar()">Entrar</button>
        <div id="erro" style="color:red;"></div>
    </div>
</div>

<div class="container" id="app">

<h1>🤖 HUNTER BRANCO MANUAL PRO</h1>
<div class="relogio" id="relogio">--:--:--</div>

<div class="card">
    <h2>Registrar Jogada</h2>
    <button class="btn vermelho" onclick="abrirNumeros(1)">🔴</button>
    <button class="btn preto" onclick="abrirNumeros(2)">⚫</button>
    <button class="btn branco" onclick="add(0,0)">⚪</button>
</div>

<div class="card">
    <h2>Histórico</h2>
    <div id="historico"></div>
</div>

<div class="card">
    <h2>Sinais</h2>
    <div id="sinais"></div>
</div>

</div>

<div id="modal" class="modal">
    <div class="modal-content" id="numeros"></div>
</div>

<script>

// LOGIN
function logar(){
    const u = document.getElementById("user").value;
    const p = document.getElementById("pass").value;

    if(u === "Diego Campos" && p === "D!3g0@2026#BlzX9"){
        document.getElementById("loginTela").style.display="none";
        document.getElementById("app").style.display="block";
    } else {
        document.getElementById("erro").innerText="Acesso negado!";
    }
}

// RELÓGIO ORIGINAL
function atualizarRelogio() {
    const horaBR = new Date().toLocaleTimeString("pt-BR", {
        timeZone: "America/Sao_Paulo"
    });
    document.getElementById("relogio").innerText = horaBR;
}
setInterval(atualizarRelogio, 1000);
atualizarRelogio();

let historico = [];
let sinais = [];
let bufferSinais = [];

function podeGerarSinal() {
    let d = new Date(), m = d.getMinutes(), s = d.getSeconds();

    if (m % 10 === 9 && s >= 15 && s <= 44) return true;
    if (m % 10 === 9 && s >= 45) return true;
    if (m % 10 === 0 && s <= 14) return true;

    return false;
}

// 🔥 DETECTA PEDRA 2
function ehPedra2(data){
    const s = data.getSeconds();
    return (s >= 45 || s <= 14);
}

function abrirNumeros(cor) {
    let html = "<h3>Escolha o número</h3>";
    let inicio = cor === 1 ? 1 : 8;
    let fim = cor === 1 ? 7 : 14;

    for (let i = inicio; i <= fim; i++) {
        html += `<button class="numero-btn" onclick="add(${cor}, ${i})">${i}</button>`;
    }

    document.getElementById("numeros").innerHTML = html;
    document.getElementById("modal").style.display = "flex";
}

function add(cor, numero) {

    document.getElementById("modal").style.display = "none";

    const agora = new Date();

    historico.push({ cor, numero, hora: agora });

    // 🔥 FIFO HISTÓRICO (roleta infinita)
    if (historico.length > 20) historico.shift();

    if (cor !== 0 && podeGerarSinal()) {

        const base = new Date(agora);
        base.setMinutes(base.getMinutes() + 1);

        const alvo = new Date(base.getTime() + numero * 60000);

        // 🔥 REGRA: SEGUNDA PEDRA = -1 MINUTO
        if(ehPedra2(agora)){
            alvo.setMinutes(alvo.getMinutes() - 1);
        }

        const hora = alvo.toLocaleTimeString("pt-BR",{hour:'2-digit',minute:'2-digit'});

        bufferSinais.push({hora});

        if (bufferSinais.length === 2) {
            sinais.push([...bufferSinais]);
            bufferSinais = [];
        }
    }

    render();
}

function render() {
    document.getElementById("historico").innerHTML =
        historico.map(r =>
            `<div class="bolinha ${r.cor==0?'b-branco':r.cor==1?'b-vermelho':'b-preto'}">${r.numero}</div>`
        ).join("");

    document.getElementById("sinais").innerHTML =
        sinais.map(par =>
            `<div class="sinal">⚪ ${par[0].hora} | ${par[1].hora}</div>`
        ).join("");
}

</script>

</body>
</html>
