<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hunter Branco Manual PRO</title>

<style>
body { background:#020617; color:#fff; font-family:Arial; text-align:center; }

/* LOGIN */
#loginTela{
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:#020617;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.login-box{
    background:#0f172a;
    padding:30px;
    border-radius:10px;
    width:300px;
}

.login-box input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:5px;
    border:none;
}

.login-box button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:5px;
    background:#22c55e;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

/* 🔥 SEU LAYOUT ORIGINAL */
.container {
    width:100%;
    max-width:900px;
    margin:auto;
    padding:10px;
}

.btn {
    font-size:30px; padding:15px; margin:5px;
    border:none; border-radius:10px; cursor:pointer;
}

.vermelho { background:#ef4444; }
.preto { background:#111; color:#fff; }
.branco { background:#fff; color:#000; }

.numero-btn { padding:10px; margin:5px; border-radius:8px; border:none; cursor:pointer; }

.card { background:#0f172a; margin:10px; padding:15px; border-radius:10px; }

.sinal { background:#1e293b; margin:5px; padding:10px; border-radius:8px; }

.relogio { font-size:20px; font-weight:bold; color:#38bdf8; margin-top:10px; }

#historico {
    display:flex;
    flex-wrap:nowrap;
    overflow-x:auto;
}

.bolinha {
    width:32px; height:32px; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center;
    font-weight:bold; margin:3px; font-size:14px;
}

.b-vermelho { background:#ef4444; }
.b-preto { background:#111; color:#fff; }
.b-branco { background:#fff; color:#000; }

.modal {
    position:fixed; top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.8);
    display:none; justify-content:center; align-items:center;
}

.modal-content { background:#0f172a; padding:20px; border-radius:10px; }
</style>
</head>

<body>

<!-- 🔐 LOGIN -->
<div id="loginTela">
    <div class="login-box">
        <h2>🔐 Acesso</h2>
        <input type="text" id="user" placeholder="Usuário">
        <input type="password" id="pass" placeholder="Senha">
        <button onclick="logar()">Entrar</button>
        <p id="erro" style="color:red;"></p>
    </div>
</div>

<!-- 🔥 SEU ROBÔ (ESCONDIDO ATÉ LOGAR) -->
<div id="app" style="display:none">

<div class="container">

<h1>🤖 HUNTER BRANCO MANUAL PRO</h1>
<div class="relogio" id="relogio"></div>

<div class="card">
    <h2>Registrar Jogada</h2>
    <button class="btn vermelho" onclick="abrirNumeros(1)">🔴</button>
    <button class="btn preto" onclick="abrirNumeros(2)">⚫</button>
    <button class="btn branco" onclick="add(0,0)">⚪</button>
</div>

<div class="card">
    <h2>Histórico</h2>
    <div id="historico"></div>
</div>

<div class="card">
    <h2>Sinais</h2>
    <div id="sinais"></div>
</div>

</div>
</div>

<div id="modal" class="modal">
    <div class="modal-content" id="numeros"></div>
</div>

<script>

/* 🔐 LOGIN */
function logar(){
    const u = document.getElementById("user").value;
    const p = document.getElementById("pass").value;

    if(u === "Diego Campos" && p === "D!3g0@2026#BlzX9"){
        document.getElementById("loginTela").style.display="none";
        document.getElementById("app").style.display="block";
    }else{
        document.getElementById("erro").innerText="Usuário ou senha inválidos";
    }
}

/* 🔥 RESTO DO SEU CÓDIGO (INALTERADO) */

let historico = [];
let sinais = [];

let pedra1 = null;
let pedra2 = null;

// RELÓGIO
function atualizarRelogio() {
    const horaBR = new Date().toLocaleTimeString("pt-BR",{timeZone:"America/Sao_Paulo"});
    document.getElementById("relogio").innerText = horaBR;
}
setInterval(atualizarRelogio,1000);

// ABRIR NÚMEROS
function abrirNumeros(cor) {
    let html = "<h3>Escolha o número</h3>";
    let inicio = cor === 1 ? 1 : 8;
    let fim = cor === 1 ? 7 : 14;

    for (let i = inicio; i <= fim; i++) {
        html += `<button onclick="add(${cor}, ${i})">${i}</button>`;
    }

    document.getElementById("numeros").innerHTML = html;
    document.getElementById("modal").style.display = "flex";
}

// ADD
function add(cor, numero) {

    document.getElementById("modal").style.display = "none";

    const agora = new Date();
    const m = agora.getMinutes();
    const s = agora.getSeconds();

    historico.push({ cor, numero, hora: agora });

    const termino9 = (m % 10 === 9);
    const termino0 = (m % 10 === 0);

    if (cor !== 0 && termino9 && s >= 15 && s <= 45) {

        let base = new Date(agora);
        base.setSeconds(0);
        base.setMilliseconds(0);
        base.setMinutes(base.getMinutes() + 1);

        let alvo = new Date(base.getTime() + numero * 60000);

        pedra1 = {
            hora: alvo.toLocaleTimeString("pt-BR",{hour:'2-digit',minute:'2-digit'}),
            numero: numero
        };
    }

    else if (cor !== 0 && (
        (termino9 && s > 45) ||
        (termino0 && s <= 15)
    )) {

        let base = new Date(agora);

        if (termino9) base.setMinutes(base.getMinutes() + 1);

        base.setSeconds(0);
        base.setMilliseconds(0);

        let alvo = new Date(base.getTime() + numero * 60000);

        pedra2 = {
            hora: alvo.toLocaleTimeString("pt-BR",{hour:'2-digit',minute:'2-digit'}),
            numero: numero
        };
    }

    if (pedra1 && pedra2) {

        if (pedra1.numero === pedra2.numero) {
            sinais.push([{hora: pedra1.hora}]);
        } else {
            sinais.push([{hora: pedra1.hora}, {hora: pedra2.hora}]);
        }

        pedra1 = null;
        pedra2 = null;
    }

    render();
}

// RENDER
function render(){
    document.getElementById("historico").innerHTML=
        historico.slice(-20).map(r=>
            `<div class="bolinha ${r.cor==0?'b-branco':r.cor==1?'b-vermelho':'b-preto'}">${r.numero}</div>`
        ).join("");

    document.getElementById("sinais").innerHTML=
        sinais.map(par=>{
            if(par.length === 1){
                return `<div class="sinal">⚪ ${par[0].hora}</div>`;
            }else{
                return `<div class="sinal">⚪ ${par[0].hora} | ${par[1].hora}</div>`;
            }
        }).join("");
}

</script>

</body>
</html>
